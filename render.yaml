services:
  - type: web
    name: auth-service
    env: docker
    plan: free
    dockerContext: InkWell.Auth
    dockerfilePath: InkWell.Auth/Dockerfile
    buildFilter:
      paths:
        - "InkWell.Auth/**"
    envVars:
      - key: ConnectionStrings__AuthDB
        value: postgresql://inkwell_zq18_user:S7NL6MZAR5fgMPOcXpsVqfoVNnCICPXO@dpg-d83bn33eo5us73b431b0-a/inkwell_zq18?sslmode=require
      - key: DOTNET_EnableDiagnostics
        value: "0"
      - key: DOTNET_gcServer
        value: "0"
      - key: Redis__ConnectionString
        fromService:
          type: redis
          name: inkwell-redis
          property: connectionString
      - key: Jwt__Secret
        value: FPICUVNej03KufTJmHzbToS8jMYHWXIuUkNRGxWHoAg=
      - key: Jwt__Issuer
        value: InkWell
      - key: Jwt__Audience
        value: InkWellUsers

